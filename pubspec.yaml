name: taxasge
description: Application de consultation des taxes fiscales de Guinée Équatoriale.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'  # Ajusté pour votre version Dart SDK actuelle

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.3.0
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3+1  # Version compatible avec Dart SDK 3.4.0
  path: 1.9.0  # Version fixe pour compatibility avec integration_test
  provider: ^6.1.4
  path_provider: ^2.1.5
  intl: ^0.20.2
  tflite_flutter: ^0.11.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17
  yaml: ^3.1.0
  # SUPPRIMÉ: material_color_utilities (utiliser la version du SDK)
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.10
  test: ^1.24.9
  sqflite_common_ffi: ^2.3.0  # Utiliser version flexible

flutter:
  uses-material-design: true
  assets:
    - assets/data/taxes.json
    - assets/data/taxes_schema.json
    - assets/ml/taxasge_model.tflite
    - assets/ml/taxasge_model_question_tokenizer.json
    - assets/ml/taxasge_model_answer_tokenizer.json
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_test:
  assets:
    - test/test_assets/test_taxes.json